---
- name: Install Minikube and Kubectl on EC2
  hosts: web
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install conntrack dependency
      apt:
        name: conntrack
        state: present

    - name: Check if Minikube is installed
      command: which minikube
      register: minikube_check
      failed_when: false
      changed_when: false

    - name: Download Minikube binary
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /tmp/minikube-linux-amd64
        mode: '0755'
      when: minikube_check.rc != 0

    - name: Install Minikube
      command: install /tmp/minikube-linux-amd64 /usr/local/bin/minikube
      when: minikube_check.rc != 0

    - name: Clean up temporary Minikube binary
      file:
        path: /tmp/minikube-linux-amd64
        state: absent
      when: minikube_check.rc != 0

    - name: Check if Kubectl is installed
      command: which kubectl
      register: kubectl_check
      failed_when: false
      changed_when: false

    - name: Download Kubectl binary
      get_url:
        url: https://dl.k8s.io/release/v1.28.2/bin/linux/amd64/kubectl
        dest: /tmp/kubectl
        mode: '0755'
      when: kubectl_check.rc != 0

    - name: Install Kubectl
      command: install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      when: kubectl_check.rc != 0

    - name: Clean up temporary Kubectl binary
      file:
        path: /tmp/kubectl
        state: absent
      when: kubectl_check.rc != 0
