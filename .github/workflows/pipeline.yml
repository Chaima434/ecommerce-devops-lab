name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # 1. Backend CI: Spring Boot Verification (All microservices via parent POM)
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

  # 2. Frontend CI: Angular Verification
  frontend-ci:
    name: Frontend CI (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # 3. Infrastructure and Configuration Verification (IaC)
  iac-validation:
    name: IaC Validation (Terraform & Ansible)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Terraform Setup & Validation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init and Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      # Ansible Setup & Syntax Check
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Ansible Syntax Check
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check -i inventory.ini playbook.yml
          ansible-playbook --syntax-check -i inventory.ini install-minikube.yml
          ansible-playbook --syntax-check -i inventory.ini k8s-deploy.yml

  # 4. Docker Build Verification
  docker-validation:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Auth Service Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: false
          tags: suivi-depenses-auth:latest

      - name: Verify Expenses Service Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./depenses-service
          file: ./depenses-service/Dockerfile
          push: false
          tags: suivi-depenses-depenses:latest

      - name: Verify API Gateway Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: false
          tags: suivi-depenses-gateway:latest

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: suivi-depenses-interface:latest

  # 5. Deploy to EC2 & Minikube (Runs after validations pass)
  deploy-to-minikube:
    name: 🚀 Deploy to EC2 & Minikube
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, iac-validation, docker-validation]
    if: false
    outputs:
      instance_ip: ${{ steps.get-ip.outputs.ip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Check for Existing EC2 Instance
        id: check-instance
        run: |
          IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=suivi-depenses-production-server" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text | head -n1)
          if [ -n "$IP" ]; then
            echo "Instance already exists with IP: $IP"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "ip=$IP" >> $GITHUB_OUTPUT
          else
            echo "No running instance found."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Apply
        if: steps.check-instance.outputs.exists != 'true'
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Generate Dynamic Inventory
        id: get-ip
        run: |
          if [ "${{ steps.check-instance.outputs.exists }}" = "true" ]; then
            IP="${{ steps.check-instance.outputs.ip }}"
          else
            IP=$(terraform -chdir=terraform output -raw instance_public_ip)
          fi
          echo "Dynamically fetched IP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "[web]" > ansible/inventory.ini
          echo "$IP ansible_user=ubuntu ansible_ssh_private_key_file=private_key.pem" >> ansible/inventory.ini

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH Private Key
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY || secrets.EC2_KEY }}
        run: |
          printf '%s\n' "$ANSIBLE_SSH_KEY" | tr -d '\r' > ansible/private_key.pem
          chmod 600 ansible/private_key.pem

      - name: Run Ansible Playbook (Install Minikube & Kubectl)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i inventory.ini install-minikube.yml --private-key=private_key.pem -e "mysql_password=${{ secrets.MYSQL_MOT_DE_PASSE }}"

      - name: Run Ansible Playbook (Deploy to Kubernetes on Minikube)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i inventory.ini k8s-deploy.yml --private-key=private_key.pem -e "mysql_password=${{ secrets.MYSQL_MOT_DE_PASSE }}"

  # 6. Output Deployment Details & URLs
  deployment-summary:
    name: 📊 Deployment Summary & Links
    runs-on: ubuntu-latest
    needs: [deploy-to-minikube]
    steps:
      - name: Generate Summary
        run: |
          IP=${{ needs.deploy-to-minikube.outputs.instance_ip }}
          
          if [ -z "$IP" ]; then
            echo "Error: IP address output from deploy-to-minikube was empty"
            exit 1
          fi
          
          echo "### 🚀 Personal Finance Tracker Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The application has been successfully deployed to Kubernetes on Minikube running on your EC2 instance." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL / Port | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **🖥️ Frontend UI** | [http://$IP:30080](http://$IP:30080) | NodePort 30080 |" >> $GITHUB_STEP_SUMMARY
          echo "| **📈 Prometheus** | [http://$IP:30090](http://$IP:30090) | NodePort 30090 |" >> $GITHUB_STEP_SUMMARY
          echo "| **📊 Grafana** | [http://$IP:30300](http://$IP:30300) | NodePort 30300 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> To manage the cluster manually, SSH into the EC2 instance (\`ssh -i ~/Downloads/chaima.pem ubuntu@$IP\`) and run \`kubectl get pods -n finmanage\`." >> $GITHUB_STEP_SUMMARY
