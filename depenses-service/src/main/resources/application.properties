spring.application.name=depenses-service
server.port=8082

spring.datasource.url=jdbc:mysql://base-donnees:3306/gestion_finances?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_MOT_DE_PASSE:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Secret - must be the same across auth-service and depenses-service
jwt.secret=FinManageSecretKey2024VeryLongSecretKeyForHS256Algorithm

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# AWS EventBridge Configuration
aws.region=${AWS_REGION:us-east-1}
eventbridge.bus.name=${EVENTBRIDGE_BUS_NAME:finmanage-bus}
