services:
  base-donnees:
    image: mysql:8.0
    container_name: suivi-depenses-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_MOT_DE_PASSE}
      MYSQL_DATABASE: gestion_finances
    volumes:
      - donnees-mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_MOT_DE_PASSE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: suivi-depenses-auth
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://base-donnees:3306/gestion_finances?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_MOT_DE_PASSE}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      base-donnees:
        condition: service_healthy

  depenses-service:
    build:
      context: ./depenses-service
      dockerfile: Dockerfile
    container_name: suivi-depenses-depenses
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://base-donnees:3306/gestion_finances?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_MOT_DE_PASSE}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      EVENTBRIDGE_BUS_NAME: finmanage-bus
    ports:
      - "8082:8082"
    depends_on:
      base-donnees:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: suivi-depenses-gateway
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - depenses-service

  interface:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suivi-depenses-interface
    restart: unless-stopped
    ports:
      - "${INTERFACE_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: suivi-depenses-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    container_name: suivi-depenses-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  donnees-mysql:
